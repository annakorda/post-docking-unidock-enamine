# Author: Anna Korda
# One conda env for the whole repo (steps 3-8): interaction/strain
# filtering and dedup need only rdkit+numpy, nested_bm_clustering/Q1-Q5
# need rdkit+numpy+matplotlib, mmgbsa_rescore needs the rest (gromacs,
# ambertools, gmx_mmpbsa, acpype, openbabel, mpi4py). All covered by one
# env instead of splitting by step.
#
# Versions (python=3.9, gromacs=2025.3, ambertools=23.6, gmx_mmpbsa=1.6.3)
# captured via `micromamba list` on the machine mmgbsa_rescore was
# benchmarked on, not a guess.
#
# No pip: section here. A plain `pip install unigbsa` pulls in a second,
# ABI-incompatible openbabel build that silently breaks the conda one
# above (every ligand's sdf->mol conversion fails). install_pip.sh has
# the real fix (--no-deps + a documented repair step) -- run it, don't
# improvise a plain pip install here.
#
# Create with:
#   conda env create -f environment.yml -p <path>/post-dock
# Then, with that env activated:
#   bash install_pip.sh
name: post-dock
channels:
  - conda-forge
dependencies:
  - python=3.9
  - gromacs=2025.3
  - ambertools=23.6
  - acpype
  - gmx_mmpbsa=1.6.3
  - rdkit
  - openbabel
  - numpy
  - pandas
  - scipy
  - matplotlib
  - mpi4py
  - openmpi
  - pip
