# Author: Anna Korda
# Conda-only base for the luna+chemtools env. Python is 3.11, not 3.9
# (luna-env's original choice) -- dimorphite-dl has no published version
# supporting <3.10 at all, and luna itself declares Requires-Python
# >=3.7,<4, so 3.11 was the safe way to satisfy both.
#
# This intentionally has NO pip: section -- luna's own setup.py imports
# rdkit and networkx at *build* time (undeclared in its own metadata),
# which breaks under pip's default isolated build sandbox. That needs an
# explicit --no-build-isolation install in a specific order, which a
# plain environment.yml pip: section can't express. See install_pip.sh
# in this same repo for the proven, verified sequence -- run it after
# creating this env, not instead of it.
#
# Create with:
#   conda env create -f environment.yml -p <path>/luna-chem
# Then, with that env activated:
#   bash install_pip.sh
name: luna-chem
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pymol-open-source
  - openbabel
  - biopython
  - networkx
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - pip
