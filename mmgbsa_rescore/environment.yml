# Author: Anna Korda
# Conda-only base for the MM-GBSA rescoring env (matches the working local
# "gbsa" env exactly -- python=3.9, gromacs=2025.3, ambertools=23.6,
# gmx_mmpbsa=1.6.3, acpype -- captured via `micromamba list` on the machine
# this pipeline was benchmarked on, not a guess).
#
# No pip: section here, same convention as the luna-chem env in this repo --
# but unlike that one, this isn't just style: a plain `pip install unigbsa`
# pulls in a second, ABI-incompatible openbabel build that silently breaks
# the conda one above (every ligand's sdf->mol conversion fails). install_pip.sh
# has the real fix (--no-deps + a documented repair step) -- run it, don't
# improvise a plain pip install here.
#
# Create with:
#   conda env create -f environment.yml -p /users/gpcr/annak/ultra-large/envs/gbsa
# Then, with that env activated:
#   bash install_pip.sh
name: gbsa
channels:
  - conda-forge
dependencies:
  - python=3.9
  - gromacs=2025.3
  - ambertools=23.6
  - acpype
  - gmx_mmpbsa=1.6.3
  - rdkit
  - openbabel
  - numpy
  - pandas
  - scipy
  - mpi4py
  - openmpi
  - pip
